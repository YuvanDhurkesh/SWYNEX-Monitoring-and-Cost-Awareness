# Settings shared by every script in scripts/.
#
# The values below describe the Task 2 deployment that this repository monitors:
# https://github.com/YuvanDhurkesh/SWYNEX-Basic-Cloud-Deployment
# They are not secrets; they are already published in the Task 2 README.

# Live site and its AWS resources
SITE_DOMAIN=d2r78cy0umfmej.cloudfront.net
DIST_ID=E3U1SQME8RV8W7
BUCKET=swynex-cloudnotes-lite-g3v99b
REGION=ap-south-1

# CloudFront is a global service: its metrics, and any alarm on them, live in us-east-1
METRICS_REGION=us-east-1

# Names and limits used by setup-monitoring.sh
ALARM_PREFIX=cloudnotes
BUDGET_NAME=swynex-monthly-cost-guardrail
MONTHLY_BUDGET_USD=1
LOG_BUCKET=swynex-cloudnotes-logs-g3v99b
LOG_PREFIX=cloudfront/
LOG_RETENTION_DAYS=30
OLD_VERSION_RETENTION_DAYS=30

# Tags applied to every resource this repository creates
PROJECT_TAG=swynex-basic-cloud-deployment
OWNER_TAG=SWYNEX-Internship
